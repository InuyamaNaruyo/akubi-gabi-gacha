name: Nightly Update Videos JSON

on:
  schedule:
    # 毎日 日本時間 午前3:00 (UTC 18:00) に自動実行
    - cron: '0 18 * * *'
  # GitHub上のボタンから手動でテスト実行可能
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: リポジトリのコードを取得
        uses: actions/checkout@v4

      - name: Node.js を準備
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: 最新の動画データを取得して videos.json を更新
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: node fetch_videos.js

      - name: 変更があれば自動コミット＆プッシュ
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add videos.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update videos.json [skip ci]" && git push)
